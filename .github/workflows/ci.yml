name: CI

on:
  pull_request:
  push:
    branches: [main, "mission/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm --prefix apps/web run typecheck
      - run: docker pull node:24-bookworm-slim
      - run: npm test

  print-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACQUIT_PRUSA: prusa-slicer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install PrusaSlicer
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            # A hung apt is cut off after 3 minutes, then the install is tried again, up to 3 attempts.
            if sudo timeout --kill-after=15 180 bash -c 'apt-get update -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 && apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 prusa-slicer xvfb xauth'; then
              exit 0
            fi
            echo "PrusaSlicer install attempt $attempt of 3 failed" >&2
            sudo timeout 120 dpkg --configure -a || true
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1
      - name: Slicer version
        run: xvfb-run -a prusa-slicer --help 2>&1 | grep -m1 PrusaSlicer-
      - name: Slicer conformance and print score card tests
        run: xvfb-run -a node --test packages/verifier-print/test/slicer.test.ts packages/verifier-print/test/print-score-card.test.ts
