name: CI

on:
  pull_request:
  push:
    branches: [main, "mission/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm --prefix apps/web run typecheck
      - run: docker pull node:24-bookworm-slim
      - run: npm test

  print-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACQUIT_PRUSA: prusa-slicer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install PrusaSlicer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends prusa-slicer xvfb xauth
      - name: Slicer version
        run: xvfb-run -a prusa-slicer --help 2>&1 | grep -m1 PrusaSlicer-
      - name: Slicer conformance tests
        run: xvfb-run -a node --test packages/verifier-print/test/slicer.test.ts
